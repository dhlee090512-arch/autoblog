name: Daily Auto Blog Generator

on:
  repository_dispatch:     # 외부 API(cron-job.org 등) 호출로 실행
    types: [run-autoblog]
  #schedule:
  #  - cron: '30 7 * * *' # 한국시간 오후 4시 30분
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    # [필수] 깃허브 액션이 레포지토리에 파일을 커밋/푸시할 수 있도록 권한 부여
    permissions:
      contents: write

    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v4

    - name: 파이썬 3.10 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필요 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium

    - name: 파이썬 스크립트 실행 (HTML 및 차트 생성)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python main.py

    - name: 생성된 파일 및 히스토리 깃허브에 자동 업로드(Commit & Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # assets, stock_history.json, blog_preview.html 등 변경된 모든 파일 반영
        git add -A
        
        git commit -m "Auto-update blog preview, stock history, and charts [skip ci]" || exit 0
        git push
