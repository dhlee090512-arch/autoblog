name: Daily Auto Blog Generator

on:
  schedule:
    - cron: '30 7 * * *' # 한국시간 오후 4시 30분
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v3

    - name: 파이썬 3.10 설치
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필요 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 파이썬 스크립트 실행 (HTML 및 차트 생성)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python main.py

    - name: 생성된 파일 깃허브에 자동 업로드(Commit)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.io"
        
        # blog_preview.html 및 존재하는 이미지 파일만 안전하게 추가
        git add blog_preview.html
        if [ -f usdkrw_chart.png ]; then
          git add usdkrw_chart.png
        fi
        
        git commit -m "Auto-generate daily blog preview [skip ci]" || exit 0
        git push
