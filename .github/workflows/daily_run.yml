name: Daily Auto Blog Generator

on:
  schedule:
    # UTC 기준 매일 07:30 (한국시간 KST 기준 매일 16:30 장 마감 후)
    - cron: '30 7 * * *'
  workflow_dispatch: # GitHub 웹페이지에서 버튼을 눌러 수동으로 즉시 실행할 수 있게 설정

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v3

    - name: 파이썬 3.10 설치
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필요 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 자동화 파이썬 스크립트 실행
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python main.py
